name: Build Native Android APK

on:
  push:
    branches:
      - native-android
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'
  pull_request:
    branches:
      - native-android
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-android.yml'
  workflow_dispatch:

jobs:
  build-native-apk:
    name: Build Native Kotlin Compose APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android-native/gradlew

      - name: Run Unit Tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
